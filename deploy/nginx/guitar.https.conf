server {
    listen 80;
    listen [::]:80;
    server_name guitar.brauliomendez.com;

    root /var/www/guitar;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name guitar.brauliomendez.com;

    ssl_certificate /etc/letsencrypt/live/guitar.brauliomendez.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guitar.brauliomendez.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/guitar;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control no-cache always;

    location / {
        try_files $uri $uri/ =404;
    }
}
